name: E2E Tests (Deployed Site)

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  E2E_BASE_URL: https://hebrew-math-adventures-2025.web.app

jobs:
  e2e:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --cpu x64 --os linux
      - run: npx playwright install --with-deps
      - run: npx playwright test --config=playwright.config.ts e2e/
